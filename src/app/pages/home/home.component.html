<!-- ═══════════════════════════
     HERO SECTION
════════════════════════════ -->
<section id="home" class="relative min-h-screen flex items-center bg-neutral-950 overflow-hidden px-6">

  <!-- Animated grid background -->
  <div class="absolute inset-0 grid-bg pointer-events-none opacity-[0.035]"></div>

  <!-- Ambient glows -->
  <div class="absolute top-1/3 left-1/4 w-96 h-96 rounded-full pointer-events-none glow-blob-1"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 rounded-full pointer-events-none glow-blob-2"></div>

  <div class="relative z-10 max-w-5xl mx-auto w-full">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center min-h-screen py-24">

      <!-- LEFT: Text -->
      <div class="flex flex-col gap-6">

        <!-- Greeting chip -->
        <div class="hero-item opacity-0 -translate-x-8">
          <span class="inline-flex items-center gap-2 bg-red-600/10 border border-red-600/30 text-red-400 text-[11px] font-bold tracking-[0.2em] uppercase px-5 py-2 rounded-full">
            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
            Open to opportunities
          </span>
        </div>

        <!-- Name -->
        <div>
          <h1 class="hero-item opacity-0 -translate-x-8 font-black text-white leading-none tracking-tighter"
            style="font-size:clamp(3rem,8vw,6rem); transition-delay:0.1s">Hi, I'm</h1>
          <h1 class="hero-item opacity-0 -translate-x-8 font-black text-red-500 leading-none tracking-tighter"
            style="font-size:clamp(3rem,8vw,6rem); transition-delay:0.2s">Melvin<br/>James</h1>
        </div>

        <!-- Typed -->
        <h2 class="hero-item opacity-0 -translate-x-8 font-black tracking-tighter typed-outline"
          style="font-size:clamp(1.2rem,3.5vw,2.2rem); transition-delay:0.3s">
          <span class="type"></span>
        </h2>

        <!-- Social icons -->
        <div class="hero-item opacity-0 -translate-x-8 flex items-center gap-3" style="transition-delay:0.4s">
          <a href="https://github.com/melvinjames1" target="_blank" class="social-btn">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/melvin-james-303561255/" target="_blank" class="social-btn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="https://www.instagram.com/melvin._.james/" target="_blank" class="social-btn">
            <i class="fab fa-instagram"></i>
          </a>
          <div class="h-px flex-1 bg-gradient-to-r from-white/10 to-transparent max-w-24 ml-2"></div>
        </div>

        <!-- CTA buttons -->
        <div class="hero-item opacity-0 -translate-x-8 flex flex-wrap gap-3" style="transition-delay:0.5s">
          <button (click)="scrollToSection('skills')"
            class="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white text-[12px] font-bold tracking-widest uppercase px-7 py-3.5 rounded-full transition-all duration-200 hover:-translate-y-1 hover:shadow-xl hover:shadow-red-600/40">
            My Skills <i class="fas fa-arrow-down text-xs"></i>
          </button>
          <button routerLink="/about"
            class="flex items-center gap-2 border border-white/10 hover:border-red-600/50 text-white/60 hover:text-red-400 text-[12px] font-bold tracking-widest uppercase px-7 py-3.5 rounded-full transition-all duration-200 hover:-translate-y-1">
            About Me <i class="fas fa-user text-xs"></i>
          </button>
        </div>

      </div>

      <!-- RIGHT: 3D Avatar -->
      <div class="hero-item opacity-0 translate-x-8 flex justify-center items-center relative" style="transition-delay:0.25s">

        <!-- Outer spinning ring -->
        <div class="absolute w-[340px] h-[340px] rounded-full border border-red-600/15 spin-slow pointer-events-none"></div>
        <!-- Dashed middle ring -->
        <div class="absolute w-[290px] h-[290px] rounded-full border border-dashed border-red-600/20 spin-reverse pointer-events-none"></div>

        <!-- 3D Avatar card -->
        <div class="avatar-3d-wrap relative w-[230px] h-[230px]" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()">
          <div class="avatar-3d w-full h-full rounded-full bg-gradient-to-br from-neutral-800 to-neutral-900 border-2 border-red-600/50 flex items-center justify-center relative overflow-hidden"
            style="transform-style: preserve-3d; box-shadow: 0 0 60px rgba(220,38,38,0.25), inset 0 0 40px rgba(0,0,0,0.5)">

            <!-- Inner glow rings -->
            <div class="absolute inset-4 rounded-full border border-red-600/20"></div>
            <div class="absolute inset-8 rounded-full border border-red-600/10"></div>

            <!-- Initials -->
            <span class="relative z-10 font-black text-red-500 select-none avatar-text"
              style="font-size:5rem; letter-spacing:-4px; text-shadow: 0 0 30px rgba(220,38,38,0.6)">MJ</span>

            <!-- Shine overlay -->
            <div class="avatar-shine absolute inset-0 rounded-full pointer-events-none"></div>
          </div>

          <!-- Floating tech dots -->
          <div class="orbit-item orbit-1 absolute w-10 h-10 rounded-full bg-neutral-900 border border-red-600/40 flex items-center justify-center shadow-lg shadow-red-600/20">
            <i class="fab fa-python text-red-400 text-sm"></i>
          </div>
          <div class="orbit-item orbit-2 absolute w-10 h-10 rounded-full bg-neutral-900 border border-red-600/40 flex items-center justify-center shadow-lg shadow-red-600/20">
            <i class="fas fa-shield-halved text-red-400 text-sm"></i>
          </div>
          <div class="orbit-item orbit-3 absolute w-10 h-10 rounded-full bg-neutral-900 border border-red-600/40 flex items-center justify-center shadow-lg shadow-red-600/20">
            <i class="fas fa-robot text-red-400 text-sm"></i>
          </div>
          <div class="orbit-item orbit-4 absolute w-10 h-10 rounded-full bg-neutral-900 border border-red-600/40 flex items-center justify-center shadow-lg shadow-red-600/20">
            <i class="fab fa-angular text-red-400 text-sm"></i>
          </div>
        </div>

        <!-- Stat chips -->
        <div class="stat-chip absolute top-4 -right-4 bg-neutral-900/90 backdrop-blur border border-white/[0.08] rounded-2xl px-4 py-3 float-chip-1">
          <p class="text-[10px] text-white/30 font-bold tracking-widest uppercase mb-0.5">Projects</p>
          <p class="text-white font-black text-xl leading-none">7+</p>
        </div>
        <div class="stat-chip absolute bottom-8 -left-6 bg-neutral-900/90 backdrop-blur border border-white/[0.08] rounded-2xl px-4 py-3 float-chip-2">
          <p class="text-[10px] text-white/30 font-bold tracking-widest uppercase mb-0.5">Experience</p>
          <p class="text-white font-black text-xl leading-none">2 yrs</p>
        </div>

      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 hero-item opacity-0" style="transition-delay:0.7s">
    <span class="text-white/20 text-[10px] font-bold tracking-[0.25em] uppercase">Scroll</span>
    <div class="scroll-line w-px h-12 bg-gradient-to-b from-red-600/60 to-transparent"></div>
  </div>

</section>

<!-- DIVIDER -->
<div class="w-full h-px bg-gradient-to-r from-transparent via-red-600/40 to-transparent"></div>

<!-- ═══════════════════════════
     SKILLS SECTION
════════════════════════════ -->
<section id="skills" class="bg-neutral-950 py-28 px-6">
  <div class="max-w-5xl mx-auto">

    <!-- Header -->
    <p class="reveal-left opacity-0 -translate-x-8 transition-all duration-700 flex items-center gap-3 text-[11px] font-bold tracking-[0.22em] uppercase text-red-500 mb-3">
      <i class="fas fa-italic text-xs"></i> Explore My
      <span class="inline-block w-10 h-px bg-red-500"></span>
    </p>
    <h1 class="reveal-left opacity-0 -translate-x-8 transition-all duration-700 font-black text-white tracking-tighter mb-4"
      style="font-size:clamp(2.6rem,7vw,5rem); transition-delay:0.1s">
      Skills
    </h1>

    <!-- Marquee skill strip -->
    <div class="marquee-wrap overflow-hidden mb-16 py-4 relative">
      <div class="absolute left-0 top-0 w-16 h-full bg-gradient-to-r from-neutral-950 to-transparent z-10 pointer-events-none"></div>
      <div class="absolute right-0 top-0 w-16 h-full bg-gradient-to-l from-neutral-950 to-transparent z-10 pointer-events-none"></div>
      <div class="marquee-track flex gap-4 w-max">
        <span *ngFor="let s of marqueeSkills"
          class="inline-flex items-center gap-2 bg-neutral-900 border border-white/[0.06] text-white/40 text-[11px] font-bold tracking-widest uppercase px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0">
          <span class="w-1 h-1 rounded-full bg-red-500"></span>{{ s }}
        </span>
        <!-- Duplicate for seamless loop -->
        <span *ngFor="let s of marqueeSkills"
          class="inline-flex items-center gap-2 bg-neutral-900 border border-white/[0.06] text-white/40 text-[11px] font-bold tracking-widest uppercase px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0">
          <span class="w-1 h-1 rounded-full bg-red-500"></span>{{ s }}
        </span>
      </div>
    </div>

    <!-- Skills grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div *ngFor="let category of skills; let ci = index"
        class="skill-card group relative bg-neutral-900 border border-white/[0.07] hover:border-red-600/30 rounded-2xl p-6 overflow-hidden"
        [style.--delay]="ci * 80 + 'ms'">

        <!-- Hover tint -->
        <div class="absolute inset-0 bg-red-600/5 opacity-0 group-hover:opacity-100 transition-opacity duration-400 rounded-2xl pointer-events-none"></div>
        <!-- Top accent -->
        <div class="absolute top-0 left-6 right-6 h-px bg-gradient-to-r from-transparent via-red-600/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-400"></div>

        <div class="relative z-10">
          <h2 class="text-[11px] font-bold tracking-widest uppercase text-white/35 mb-5 flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-red-500 flex-shrink-0"></span>
            {{ category.title }}
          </h2>
          <div class="grid grid-cols-2 gap-2">
            <div *ngFor="let skill of category.skills"
              class="flex items-center gap-2.5 bg-neutral-950/70 border border-white/[0.05] hover:border-red-600/30 rounded-xl px-3 py-2.5 transition-all duration-200 hover:-translate-y-0.5 group/sk">
              <img [src]="skill.image" [alt]="skill.name" class="w-5 h-5 object-contain flex-shrink-0 transition-transform duration-300 group-hover/sk:scale-110"/>
              <span class="text-white/55 text-[11px] font-semibold group-hover/sk:text-white/90 transition-colors duration-200 truncate">{{ skill.name }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Back to top -->
    <div class="flex justify-center mt-16">
      <button (click)="scrollToSection('home')"
        class="flex items-center gap-2 border border-white/10 hover:border-red-600/50 text-white/50 hover:text-red-400 text-[12px] font-bold tracking-widest uppercase px-7 py-3 rounded-full transition-all duration-200 hover:-translate-y-1">
        Back to Top <i class="fas fa-arrow-up text-xs"></i>
      </button>
    </div>

  </div>
</section>
