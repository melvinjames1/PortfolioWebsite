<nav class="fixed left-5 top-1/2 -translate-y-1/2 z-50 hidden lg:flex flex-col items-center gap-1">
  <div class="absolute left-1/2 -translate-x-1/2 top-5 bottom-5 w-px bg-white/[0.06]"></div>
  <ng-container *ngFor="let nav of [
    { id: 'home',   icon: 'fas fa-home',  label: 'Home'   },
    { id: 'skills', icon: 'fas fa-bolt',  label: 'Skills' }
  ]">
    <button
      (click)="scrollToSection(nav.id)"
      class="group relative z-10 w-10 h-10 rounded-full flex items-center justify-center
        transition-all duration-300 border border-white/10 bg-black/80 backdrop-blur
        hover:border-red-600/70 hover:shadow-md hover:shadow-red-600/20 hover:-translate-y-px"
      [class.!border-red-600]="activeSection === nav.id"
      [class.!bg-red-600]="activeSection === nav.id"
      [class.shadow-md]="activeSection === nav.id"
      [attr.aria-label]="nav.label">
      <i [class]="nav.icon + ' text-sm transition-colors duration-200'"
         class="text-gray-400"
         [class.!text-white]="activeSection === nav.id"></i>
      <span class="pointer-events-none absolute left-14 whitespace-nowrap
        bg-neutral-900 border border-red-600/40 text-red-400
        text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded
        opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0
        transition-all duration-200">{{ nav.label }}</span>
      <span *ngIf="activeSection === nav.id"
        class="absolute inset-0 rounded-full border border-red-500/40 animate-ping pointer-events-none"
        style="animation-duration:2s"></span>
    </button>
    <div class="h-2"></div>
  </ng-container>
</nav>

<!-- ═══════════════════════════
     HERO SECTION
════════════════════════════ -->
<section id="home" class="flex items-center bg-neutral-950  overflow-hidden px-6">

  <!-- Animated geometric lines canvas -->

  <div class="relative z-10 max-w-5xl mx-auto w-full">

      <div class="flex flex-col gap-6">

        <div class="hero-item opacity-0 -translate-x-8">

            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>

        </div>

        <div>

          <span class="type"></span>
        </h2>

        <div class="hero-item opacity-0 -translate-x-8 flex items-center gap-3" style="transition-delay:0.4s">
          <a href="https://github.com/melvinjames1" target="_blank" class="social-btn">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/melvin-james-303561255/" target="_blank" class="social-btn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="https://www.instagram.com/melvin._.james/" target="_blank" class="social-btn">
            <i class="fab fa-instagram"></i>
          </a>
          <div class="h-px flex-1 bg-gradient-to-r from-white/10 to-transparent max-w-24 ml-2"></div>

          <button (click)="scrollToSection('skills')"

          </button>
        </div>

      </div>

      <!-- RIGHT: Photo Avatar -->

          <!-- Actual photo -->

            src="assets/melvin.jpeg"
            alt="Melvin James"

          </div>

          <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 z-20

</section>

<div class="w-full h-px bg-gradient-to-r from-transparent via-red-600/40 to-transparent"></div>

<!-- ═══════════════════════════
     SKILLS SECTION
════════════════════════════ -->
<section id="skills" class="bg-neutral-950 py-28 px-6">
  <div class="max-w-5xl mx-auto">


    <p class="reveal-left opacity-100 -translate-x-8 transition-all duration-700
      flex items-center gap-3 text-[11px] font-bold tracking-[0.22em] uppercase text-red-500 mb-3">
      <i class="fas fa-italic text-xs"></i> Explore My
      <span class="inline-block w-10 h-px bg-red-500"></span>
    </p>
    <h1 class="reveal-left opacity-0 -translate-x-8 transition-all duration-700
      font-black text-white tracking-tighter mb-4"
      style="font-size:clamp(2.6rem,7vw,5rem); transition-delay:0.1s">
      Skills
    </h1>

    <div class="marquee-wrap overflow-hidden mb-16 py-4 relative">
      <div class="absolute left-0 top-0 w-16 h-full bg-gradient-to-r from-neutral-950 to-transparent z-10 pointer-events-none"></div>
      <div class="absolute right-0 top-0 w-16 h-full bg-gradient-to-l from-neutral-950 to-transparent z-10 pointer-events-none"></div>
      <div class="marquee-track flex gap-3 w-max">
        <span *ngFor="let s of marqueeSkills"
          class="inline-flex items-center gap-2 bg-neutral-900 border border-white/[0.06] text-white/40 text-[10px] font-bold tracking-widest uppercase px-4 py-2 rounded-full whitespace-nowrap hover:border-red-600/40 hover:text-red-400/80 transition-all duration-200">
          <span class="w-1 h-1 rounded-full bg-red-500"></span>{{ s }}
        </span>
        <span *ngFor="let s of marqueeSkills"
          class="inline-flex items-center gap-2 bg-neutral-900 border border-white/[0.06] text-white/40 text-[10px] font-bold tracking-widest uppercase px-4 py-2 rounded-full whitespace-nowrap hover:border-red-600/40 hover:text-red-400/80 transition-all duration-200">
          <span class="w-1 h-1 rounded-full bg-red-500"></span>{{ s }}
        </span>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div *ngFor="let category of skills; let ci = index"
        class="skill-card group relative rounded-2xl p-6 overflow-hidden cursor-default bg-neutral-900/40 border border-white/[0.03]"
        [style.--delay]="ci * 80 + 'ms'"
        (mousemove)="onCardMouseMove($event)">

        <div class="card-glow absolute inset-0 rounded-2xl pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        <div class="absolute top-0 left-6 right-6 h-px bg-gradient-to-r from-transparent via-red-600/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-400"></div>

        <div class="relative z-10">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-[11px] font-bold tracking-widest uppercase text-white/35 flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-red-500 flex-shrink-0 group-hover:shadow-sm group-hover:shadow-red-500 transition-shadow duration-300"></span>
              {{ category.title }}
            </h2>
            <span class="text-[10px] font-bold text-red-500/50 bg-red-600/[.07] border border-red-600/15 px-2 py-0.5 rounded-full">
              {{ category.skills.length }}
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div *ngFor="let skill of category.skills; let si = index"
              (click)="openDocs(skill.url)"
              class="skill-item flex items-center gap-2.5
                bg-neutral-950/70 border border-white/[0.05]
                hover:border-red-600/50 hover:bg-red-600/[.08]
                rounded-xl px-3 py-2.5 transition-all duration-200
                hover:-translate-y-1 group/sk cursor-pointer"
              [style.transition-delay]="(si * 35) + 'ms'">
              <img [src]="skill.icon" [alt]="skill.name" width="18" height="18"
                class="object-contain flex-shrink-0 transition-transform duration-300 group-hover/sk:scale-110 group-hover/sk:-rotate-6"/>
              <span class="text-white/50 text-[11px] font-semibold truncate transition-colors duration-200 group-hover/sk:text-white/90">
                {{ skill.name }}
              </span>
              <i class="fas fa-external-link-alt text-[8px] text-red-500/0 group-hover/sk:text-red-500/60 transition-all ml-auto"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-center mt-16">
      <button (click)="scrollToSection('home')"
        class="flex items-center gap-2 border border-white/10 hover:border-red-600/50 text-white/50 hover:text-red-400 text-[12px] font-bold tracking-widest uppercase px-7 py-3 rounded-full transition-all duration-200 hover:-translate-y-1 active:scale-95">
        Back to Top <i class="fas fa-arrow-up text-xs"></i>
      </button>
    </div>
  </div>
</section>
