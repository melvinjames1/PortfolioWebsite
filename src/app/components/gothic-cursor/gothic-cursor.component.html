<!-- ① Dot — snaps instantly to mouse -->
<div class="g-dot"
     [class.hovered]="isHovered"
     [class.clicked]="isClicked"
     [style.left.px]="mx"
     [style.top.px]="my">
</div>

<!-- ② Crosshair ring — slight lag -->
<svg class="g-ring"
     [class.hovered]="isHovered"
     [class.clicked]="isClicked"
     [style.left.px]="rx"
     [style.top.px]="ry"
     viewBox="0 0 40 40"
     xmlns="http://www.w3.org/2000/svg">
  <circle cx="20" cy="20" r="14" fill="none" stroke="#cc0000" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="2"  x2="20" y2="10" stroke="#cc0000" stroke-width="0.8" opacity="0.7"/>
  <line x1="20" y1="30" x2="20" y2="38" stroke="#cc0000" stroke-width="0.8" opacity="0.7"/>
  <line x1="2"  y1="20" x2="10" y2="20" stroke="#cc0000" stroke-width="0.8" opacity="0.7"/>
  <line x1="30" y1="20" x2="38" y2="20" stroke="#cc0000" stroke-width="0.8" opacity="0.7"/>
</svg>

<!-- ③ Anime boy sprite — heavy lag, haunting follow -->
<img class="g-girl"
     [class.state-idle]="sprite === 'idle'"
     [class.state-hover]="sprite === 'hover'"
     [class.state-click]="sprite === 'click'"
     [src]="'assets/cursors/cursor_' + sprite + '.png'"
     [style.left.px]="gx"
     [style.top.px]="gy"
     alt=""
     aria-hidden="true" />

<!-- ④ Blood trail -->
<div *ngFor="let d of trail"
     class="blood-drop"
     [style.left.px]="d.x"
     [style.top.px]="d.y"
     [style.opacity]="d.opacity"
     [style.width.px]="d.size"
     [style.height.px]="d.size * 1.4">
</div>

<!-- ⑤ Click splash burst -->
<div *ngFor="let p of splash; trackBy: trackById"
     class="splash-drop"
     [style.left.px]="p.x"
     [style.top.px]="p.y"
     [style.width.px]="p.size"
     [style.height.px]="p.size * 1.4"
     [style.--tx]="p.tx"
     [style.--ty]="p.ty">
</div>
