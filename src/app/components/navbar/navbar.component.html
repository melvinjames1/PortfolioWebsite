<!-- Scroll progress bar -->
<div class="scroll-progress" [style.width]="scrollProgress + '%'"></div>

<!-- ── Main Header ──────────────────────────────────────── -->
<header class="nav-header fixed top-0 left-0 w-full z-50
  px-6 md:px-12 py-5
  flex items-center justify-between
  border-b border-transparent bg-transparent" [class.scrolled]="isScrolled">

  <!-- Logo -->
  <a (click)="navigateTo('/')"
    class="text-lg md:text-xl font-bold tracking-tight text-white select-none no-underline cursor-pointer"
    style="font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em;">
    <span class="text-red-500">&lt;</span>Melvin<span class="text-red-500">/</span>James<span
      class="text-red-500">&gt;</span>
  </a>

  <!-- Desktop Nav -->
  <nav class="hidden md:flex items-center gap-0.5">
    <a (click)="navigateTo('/')"
      class="nav-link relative text-white/50 hover:text-white text-[13px] font-medium tracking-wide px-4 py-2 rounded-lg transition-all duration-200 hover:bg-white/[0.04] no-underline cursor-pointer">
      Home
    </a>
    <a (click)="navigateTo('/projects')"
      class="nav-link relative text-white/50 hover:text-white text-[13px] font-medium tracking-wide px-4 py-2 rounded-lg transition-all duration-200 hover:bg-white/[0.04] no-underline cursor-pointer">
      Projects
    </a>
    <a (click)="navigateTo('/about')"
      class="nav-link relative text-white/50 hover:text-white text-[13px] font-medium tracking-wide px-4 py-2 rounded-lg transition-all duration-200 hover:bg-white/[0.04] no-underline cursor-pointer">
      About
    </a>
  </nav>

  <!-- Mobile hamburger -->
  <button (click)="toggleMenu()" id="mobile-menu-btn" aria-label="Toggle menu" class="md:hidden w-9 h-9 rounded-lg border border-white/10 hover:border-white/20
      bg-white/[0.03] flex flex-col justify-center items-center gap-1.5
      transition-all duration-200 group">
    <span class="block w-4 h-[1.5px] bg-white/60 transition-all duration-300 origin-center" [class.rotate-45]="menuOpen"
      [class.translate-y-[6px]]="menuOpen"></span>
    <span class="block w-4 h-[1.5px] bg-white/60 transition-all duration-200" [class.opacity-0]="menuOpen"></span>
    <span class="block w-4 h-[1.5px] bg-white/60 transition-all duration-300 origin-center"
      [class.-rotate-45]="menuOpen" [class.-translate-y-[6px]]="menuOpen"></span>
  </button>

</header>

<!-- Mobile Drawer -->
<div class="fixed top-[73px] left-0 w-full z-40 md:hidden px-4
  transition-all duration-300 ease-out" [class.opacity-0]="!menuOpen" [class.pointer-events-none]="!menuOpen"
  [class.-translate-y-2]="!menuOpen" [class.translate-y-0]="menuOpen">

  <div class="rounded-2xl bg-[#0f0f0f]/98 backdrop-blur-2xl border border-white/[0.08]
    overflow-hidden shadow-2xl shadow-black/60">

    <nav class="flex flex-col p-3 gap-1">
      <a (click)="navigateTo('/')" class="flex items-center gap-3 text-white/50 hover:text-white hover:bg-white/[0.04]
          text-[14px] font-medium px-4 py-3 rounded-xl transition-all duration-150 no-underline cursor-pointer">
        Home
      </a>
      <a (click)="navigateTo('/projects')" class="flex items-center gap-3 text-white/50 hover:text-white hover:bg-white/[0.04]
          text-[14px] font-medium px-4 py-3 rounded-xl transition-all duration-150 no-underline cursor-pointer">
        Projects
      </a>
      <a (click)="navigateTo('/about')" class="flex items-center gap-3 text-white/50 hover:text-white hover:bg-white/[0.04]
          text-[14px] font-medium px-4 py-3 rounded-xl transition-all duration-150 no-underline cursor-pointer">
        About
      </a>
    </nav>

    <div class="border-t border-white/[0.05] p-4">
      <a href="mailto:melvin.mj576@gmail.com" class="flex items-center justify-center gap-2 bg-red-600/10 border border-red-600/20
          hover:bg-red-600/20 text-red-400 hover:text-red-300
          text-[13px] font-medium px-4 py-3 rounded-xl transition-all duration-150 no-underline cursor-pointer">
        <i class="fas fa-envelope text-xs"></i>
        melvin.mj576&#64;gmail.com
      </a>
    </div>

  </div>
</div>

<!-- Backdrop -->
<div *ngIf="menuOpen" (click)="closeMenu()" class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm md:hidden">
</div>
